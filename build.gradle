plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// Settlement Core, the settlement engine every race mod builds on: rooms dug from plans, their crews and work, the haul and
// the hoard, larders and fare, a settlement that defends itself, and crowds drawn fast. Its own repo since 2026-10-31 (split
// out of under-empire's :core with its history, then moved from 1.21.1 to 26.1.2). It registers nothing: a race does.
version = project.mod_version
group = 'claude.settlementcore'
base { archivesName = 'settlementcore' }

// Mojang ships Java 25 with 26.1, so mods target it
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The test race (src/testrace, mod id testrace): a dev-only race on the engine, to see it run and to copy from. Its own source
// set and its own jar (testraceJar); the engine's jar never holds it.
sourceSets {
    testrace {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    testraceImplementation.extendsFrom implementation
    testraceRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'com.geckolib' }
    }
}

dependencies {
    // GeckoLib: the crowd renderer (client/) draws every race's units through it
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

// The GameTest runs' long checks, off unless asked (docs/testing-beyond-gametests.md):
// -Psoak[=<ticks>] -Ponly=soak : the soak tests run (test/Soak; an hour of game time unless a length is given), else they pass at once
// (tools/soak.py). -Psavecheck=runs/savecheck/<name>[;...] -Ponly=savecheck : load and save copies of old worlds with this build
// (test/SaveCheckGameTests, tools/savecheck.py; each folder made absolute here, as a GameTest server works in its game directory);
// -Psavecheckallow=<path>,... : save keys a block entity may drop on purpose.
def soakAndSavecheck = [
        'settlementcore.soak'                    : project.hasProperty('soak') ? (project.findProperty('soak') ?: 'true') : '',
        'settlementcore.savecheck'               : ((project.findProperty('savecheck') ?: '') as String).split(';')
                .findAll { !it.trim().isEmpty() }.collect { project.file(it.trim()).absolutePath }.join(';'),
        'settlementcore.savecheck.allowdropped'  : project.findProperty('savecheckallow') ?: '',
]

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.testrace
    // GeckoLib 5 makes every EntityRenderState a GeoRenderState by interface injection; its jar doesn't carry the file, so
    // compiling against it needs this copy (from its sources jar's META-INF/interface_injections.json)
    interfaceInjectionData {
        from(file('geckolib_interface_injections.json'))
    }

    runs {
        configureEach {
            // the runs load the test race too, so its classes (and the engine's) are on their classpath
            sourceSet = sourceSets.testrace
            // -Ptestns=settlementcore : only those mods' GameTests are registered (test/GameTests; 26.1 has no
            // neoforge.enabledGameTestNamespaces any more). Unset, every loaded mod's tests are.
            systemProperty 'settlementcore.testns', project.findProperty('testns') ?: ''
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
        // ./gradlew runBridgeClient : the engine and the test race in a hidden dev game with devbridge (block bench/devbridge),
        // which tools/devbridge.py start --project settlementcore builds and puts in runs/bridge/mods; the debug port is its
        // hot swap
        bridgeClient {
            client()
            gameDirectory = project.file('runs/bridge')
            systemProperty 'devbridge', 'true'
            systemProperty 'devbridge.visible', project.hasProperty('visible') ? 'true' : 'false'
            systemProperty 'devbridge.world', project.findProperty('bridgeworld') ?: 'bridge'
            systemProperty 'devbridge.root', project.findProperty('devbridgeroot') ?: ''
            systemProperty 'devbridge.structures', project.findProperty('devbridgestructures') ?: ''
            jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
            programArguments.addAll('--width', '1280', '--height', '720')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/gametest')
            // -Ponly=settlement,raise : just those batches, tests or test classes, by name (test/GameTests)
            systemProperty 'settlementcore.only', project.findProperty('only') ?: ''
            // -Pwatchdogselftest=<batch> : un-force a chunk of that batch's first test as it starts; the watchdog
            // (test/TestWatchdog) should then fail that test with its report instead of the run hanging
            systemProperty 'settlementcore.watchdog.selftest', project.findProperty('watchdogselftest') ?: ''
            // -Pcrewtrace : every crew settler's chores to the log (unit/CrewGoal)
            systemProperty 'settlementcore.crewtrace', project.hasProperty('crewtrace') ? 'true' : 'false'
            // this server ticks as fast as it can, so what runs on a time budget counts work instead, and a test passes or
            // fails the same on any machine; the benchmarks (-Pperf) keep the real clock
            systemProperty 'settlementcore.deterministic', project.hasProperty('perf') ? 'false' : 'true'
            if (project.hasProperty('perf')) {
                systemProperty 'settlementcore.perf', 'true'
                systemProperty 'settlementcore.perfflags', project.findProperty('perfflags') ?: ''
            }
            soakAndSavecheck.each { k, v -> systemProperty k, v }
        }
        // ./gradlew runGameTestServerTogether : every 26.1 mod's GameTests in one server, the user's mods loaded together with this
        // engine (tools/together.py prepare fills runs/together/mods with the deployed jars, and writes runs/together/run.properties:
        // the list test/TogetherGameTests checks, and each mod's -Ponly). FML loads a dev run's <game dir>/mods like a game's
        // (its ModsFolderLocator, FMLPaths.MODSDIR). The JUnit-style report.xml lists every test of every mod, for tools/together.py report.
        gameTestServerTogether {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/together')
            programArguments.addAll('--report', 'report.xml')
            systemProperty 'settlementcore.only', project.findProperty('only') ?: ''
            systemProperty 'settlementcore.watchdog.selftest', ''
            systemProperty 'settlementcore.crewtrace', 'false'
            systemProperty 'settlementcore.deterministic', 'true'
            soakAndSavecheck.each { k, v -> systemProperty k, v }
            def together = project.file('runs/together/run.properties')
            if (together.isFile()) {
                def p = new Properties()
                together.withInputStream { p.load(it) }
                p.each { k, v -> systemProperty k.toString(), v.toString() }
            }
        }
    }

    mods {
        settlementcore {
            sourceSet sourceSets.main
        }
        testrace {
            sourceSet sourceSets.testrace
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '3000']
}

// The same commit builds the same jar on any machine: no file times in it, its files in a fixed order. The laptop builds the jars a
// ship copies (block bench/under-empire/tools/ship.py --record-built), and a PC build of that commit can be checked against them.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

['processResources', 'processTestraceResources'].each { name ->
    tasks.named(name, ProcessResources).configure {
        def props = [version: project.version, minecraft_version: project.minecraft_version, neo_version: project.neo_version,
                     geckolib_version: project.geckolib_version]
        inputs.properties props
        filesMatching('META-INF/neoforge.mods.toml') {
            expand props
        }
    }
}

// build/libs/settlementcore-testrace-<version>.jar: the test race, for a dev instance beside the engine's jar
tasks.register('testraceJar', Jar) {
    group = 'build'
    description = "Builds the test race's jar."
    archiveBaseName = 'settlementcore-testrace'
    from sourceSets.testrace.output
}
tasks.named('assemble') { dependsOn 'testraceJar' }

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'Settlement Core',
                'Specification-Version'   : project.version,
                'Implementation-Title'    : 'Settlement Core',
                'Implementation-Version'  : project.version
        ])
    }
}

// The compile classpath as a file, for a plain-javac typecheck between gradle turns (tools/typecheck.py)
tasks.register('writeCompileClasspath') {
    description = 'Writes the main compile classpath to build/compile-classpath.txt.'
    def cp = sourceSets.main.compileClasspath
    def out = layout.buildDirectory.file('compile-classpath.txt')
    inputs.files(cp)
    outputs.file(out)
    doLast {
        out.get().asFile.text = cp.files.collect { it.absolutePath }.join(File.pathSeparator)
    }
}

// The engine names no race's namespace: its data lives under settlementcore (and the shared minecraft, c and neoforge),
// and neither its data nor its code names another mod's resource. A race adds to the engine's data from its own jar
// instead (the Skaven's warren_stew in settlementcore:fare_feast). One more race, one more entry in `races`.
tasks.register('checkCoreNamespace') {
    group = 'verification'
    description = "Fails if Settlement Core's data or code names a race mod's namespace."
    def races = ['underempire', 'greatplan', 'khazuk', 'waaagh', 'bloodlines']
    def res = file('src/main/resources')
    def src = file('src/main/java')
    inputs.dir(res)
    inputs.dir(src)
    inputs.property('races', races)
    doLast {
        def shared = ['settlementcore', 'minecraft', 'c', 'neoforge'] as Set
        def problems = []
        ['data', 'assets'].each { top ->
            def d = new File(res, top)
            if (d.isDirectory()) {
                d.eachDir { ns -> if (!shared.contains(ns.name)) { problems << "${top}/${ns.name}/" } }
            }
        }
        res.eachFileRecurse { f ->
            if (f.isFile() && (f.name.endsWith('.json') || f.name.endsWith('.mcmeta'))) {
                (f.getText('UTF-8') =~ /"#?([a-z0-9_.-]+):[a-z0-9_\/.-]+"/).each { m ->
                    if (!shared.contains(m[1])) { problems << "${f.name}: ${m[0]}" }
                }
            }
        }
        def named = ~/"(${races.join('|')})(:|")/
        src.eachFileRecurse { f ->
            if (f.name.endsWith('.java')) {
                (f.getText('UTF-8') =~ named).each { m -> problems << "${f.name}: ${m[0]}" }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Settlement Core names a race's namespace:\n  " + problems.unique().join('\n  '))
        }
    }
}
tasks.named('compileJava') { dependsOn 'checkCoreNamespace' }
