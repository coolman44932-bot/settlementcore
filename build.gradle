plugins {
    id 'java'
    // the version comes from the root project's plugins block (a second one here is an error)
    id 'net.neoforged.moddev'
}

// Settlement Core, the settlement engine every race mod builds on (docs/plans/core-step2.md). It has no runs of its own:
// the root project's runs load it beside the Under-Empire (the root's neoForge { mods { settlementcore } }).
version = '0.1.0'
group = 'claude.underempire'
base { archivesName = 'settlementcore' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}

dependencies {
    // GeckoLib: the crowd renderer (core/client) draws every race's units through it
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
}

neoForge {
    version = '21.1.248'
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

tasks.named('processResources', ProcessResources).configure {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'Settlement Core',
                'Specification-Version'   : project.version,
                'Implementation-Title'    : 'Settlement Core',
                'Implementation-Version'  : project.version
        ])
    }
}

// The engine names no race's namespace: its data lives under settlementcore (and the shared minecraft, c and neoforge),
// and neither its data nor its code names another mod's resource ("underempire:..."). A race adds to the engine's data
// from its own jar instead (the Skaven's warren_stew in settlementcore:fare_feast). docs/plans/core-step2.md, C8.
tasks.register('checkCoreNamespace') {
    group = 'verification'
    description = "Fails if Settlement Core's data or code names a race mod's namespace."
    def res = file('src/main/resources')
    def src = file('src/main/java')
    inputs.dir(res)
    inputs.dir(src)
    doLast {
        def shared = ['settlementcore', 'minecraft', 'c', 'neoforge'] as Set
        def problems = []
        ['data', 'assets'].each { top ->
            def d = new File(res, top)
            if (d.isDirectory()) {
                d.eachDir { ns -> if (!shared.contains(ns.name)) { problems << "${top}/${ns.name}/" } }
            }
        }
        res.eachFileRecurse { f ->
            if (f.isFile() && (f.name.endsWith('.json') || f.name.endsWith('.mcmeta'))) {
                (f.getText('UTF-8') =~ /"#?([a-z0-9_.-]+):[a-z0-9_\/.-]+"/).each { m ->
                    if (!shared.contains(m[1])) { problems << "${f.name}: ${m[0]}" }
                }
            }
        }
        src.eachFileRecurse { f ->
            if (f.name.endsWith('.java')) {
                (f.getText('UTF-8') =~ /"(underempire|lustria)(:|")/).each { m -> problems << "${f.name}: ${m[0]}" }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Settlement Core names a race's namespace:\n  " + problems.unique().join('\n  '))
        }
    }
}
tasks.named('compileJava') { dependsOn 'checkCoreNamespace' }
