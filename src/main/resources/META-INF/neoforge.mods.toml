modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
    modId = "settlementcore"
    version = "${version}"
    displayName = "Settlement Core"
    authors = "built with Claude"
    description = """
The settlement engine under the Under-Empire and the races to come: rooms dug from plans, their crews and
work, the haul and the hoard, larders and fare, a settlement that defends itself, and crowds drawn fast.
It adds nothing by itself: a race mod builds on it."""

[[dependencies.settlementcore]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.settlementcore]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version}]"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.settlementcore]]
    modId = "geckolib"
    type = "required"
    # any 5.x: the horde renderer (client/HordeRenderer) uses GeckoLib internals a minor may change, and falls back to GeckoLib's own fill
    # if they did (a LinkageError of GeckoLib's), so a newer 5.x the CurseForge app hands players draws plain rather than refusing to load
    versionRange = "[${geckolib_version},6)"
    ordering = "NONE"
    side = "BOTH"
