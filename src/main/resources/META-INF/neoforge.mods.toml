modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
    modId = "settlementcore"
    version = "${version}"
    displayName = "Settlement Core"
    authors = "built with Claude"
    description = """
The settlement engine under the Under-Empire and the races to come: rooms dug from plans, their crews and
work, the haul and the hoard, larders and fare, a settlement that defends itself, and crowds drawn fast.
It adds nothing by itself: a race mod builds on it."""

[[dependencies.settlementcore]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.settlementcore]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version}]"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.settlementcore]]
    modId = "geckolib"
    type = "required"
    # to the next minor only: the horde renderer (client/HordeRenderer) overrides GeckoLib's @NonExtendable fillRenderState and
    # calls its @Internal captureDefaultRenderState and AnimationProcessor.extractControllerStates, which a minor may change.
    # Raise geckolib_version past 5.5 and this bound goes with it.
    versionRange = "[${geckolib_version},5.6)"
    ordering = "NONE"
    side = "BOTH"
